name: AlignIQ Daily Multi-Agent Council

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Learning & Pre-Game Locking Agent
        run: python agent.py

      - name: Run Owner Audit & Optimization Council
        run: python owner_agents.py

      - name: Commit & Push Agent Reports
        run: |
          git config user.name "AlignIQ Agent"
          git config user.email "agent@aligniq.local"
          git add history.json agent_report.json algo_config.json analysis_report.json owner_approvals.json daily_reports/
          git diff --staged --quiet || git commit -m "Daily Multi-Agent Audit, Pre-Game Lock & Post-Game Learning"
          git push