name: AlignIQ Daily Agent

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AlignIQ Agent
        run: python agent.py

      - name: Commit updated history, report, and fighters
        run: |
          git config user.name "AlignIQ Agent"
          git config user.email "agent@aligniq.app"
          git add history.json agent_report.json fighters.json
          git diff --staged --quiet || git commit -m "Auto-update AlignIQ stats, weights & fighters"
          git push
