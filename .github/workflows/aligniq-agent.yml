name: AlignIQ Daily Grading & Weekly Optimizer

on:
  schedule:
    # Runs every day at 7:15 AM EST (12:15 UTC)
    - cron: '15 12 * * *'
  workflow_dispatch: # Allows you to tap "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AlignIQ Agent
        run: python agent.py

      - name: Commit updated history and report
        run: |
          git config user.name "AlignIQ Agent"
          git config user.email "actions@github.com"
          git add history.json agent_report.json
          git diff --staged --quiet || git commit -m "AlignIQ Agent: daily grade & report update"
          git push
